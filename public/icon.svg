<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#d97706"/>
    </linearGradient>
  </defs>

  <!-- Background rounded squircle with safe padding -->
  <rect width="512" height="512" rx="112" fill="url(#bg)"/>

  <!-- Inner glowing circle -->
  <circle cx="256" cy="256" r="200" fill="#ffffff" opacity="0.12"/>

  <!-- Mascot Kiki Face Centerpiece -->
  <!-- Ears -->
  <ellipse cx="170" cy="150" rx="36" ry="85" fill="#d97706" transform="rotate(-25 170 150)"/>
  <ellipse cx="170" cy="150" rx="20" ry="55" fill="#fde68a" transform="rotate(-25 170 150)"/>
  <ellipse cx="342" cy="150" rx="36" ry="85" fill="#d97706" transform="rotate(25 342 150)"/>
  <ellipse cx="342" cy="150" rx="20" ry="55" fill="#fde68a" transform="rotate(25 342 150)"/>

  <!-- Antlers -->
  <path d="M195 125 L175 75 M185 98 L210 82" stroke="#78350f" stroke-width="10" stroke-linecap="round"/>
  <path d="M317 125 L337 75 M327 98 L302 82" stroke="#78350f" stroke-width="10" stroke-linecap="round"/>

  <!-- Head -->
  <circle cx="256" cy="270" r="135" fill="#f59e0b"/>
  <ellipse cx="256" cy="305" rx="95" ry="75" fill="#fef3c7"/>

  <!-- Cheeks -->
  <circle cx="180" cy="305" r="24" fill="#fb7185" opacity="0.7"/>
  <circle cx="332" cy="305" r="24" fill="#fb7185" opacity="0.7"/>

  <!-- Wisdom Glasses -->
  <circle cx="205" cy="255" r="44" fill="none" stroke="#0284c7" stroke-width="10"/>
  <circle cx="307" cy="255" r="44" fill="none" stroke="#0284c7" stroke-width="10"/>
  <line x1="249" y1="255" x2="263" y2="255" stroke="#0284c7" stroke-width="10"/>

  <!-- Happy Sparkling Eyes -->
  <path d="M185 255 Q205 235 225 255" fill="none" stroke="#1e293b" stroke-width="11" stroke-linecap="round"/>
  <path d="M287 255 Q307 235 327 255" fill="none" stroke="#1e293b" stroke-width="11" stroke-linecap="round"/>

  <!-- Nose -->
  <ellipse cx="256" cy="298" rx="14" ry="10" fill="#3b1d11"/>

  <!-- Smile -->
  <path d="M228 312 Q256 352 284 312" fill="#be123c" stroke="#3b1d11" stroke-width="8" stroke-linecap="round"/>

  <!-- Star of Achievement at Bottom -->
  <polygon points="256,380 270,412 305,415 278,437 286,470 256,450 226,470 234,437 207,415 242,412" fill="url(#gold)" stroke="#b45309" stroke-width="4"/>

  <!-- Math Symbols -->
  <text x="75" y="140" font-family="sans-serif" font-weight="900" font-size="52" fill="#fde047">➕</text>
  <text x="390" y="140" font-family="sans-serif" font-weight="900" font-size="52" fill="#34d399">✖️</text>
</svg>
